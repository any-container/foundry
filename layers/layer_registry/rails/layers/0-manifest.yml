# Static representation of the layer ENV variables for this deployment.
# config/initializers/00_layers.rb loads each entry into ENV at boot.
# An ENV value already set in the environment wins over the value here.
# One entry per layer: LAYER_<NAME in upper case>. Values: "true" or "false".
# Each entry needs a description file layers/<name>.md.
LAYER_LAYER_REGISTRY: "true"
